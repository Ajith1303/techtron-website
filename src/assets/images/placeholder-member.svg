<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1734"/>
      <stop offset="1" stop-color="#172254"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#608BFA"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="399" height="499" stroke="url(#ring)" stroke-opacity="0.3"/>
  <!-- Head -->
  <circle cx="200" cy="190" r="70" fill="url(#ring)" fill-opacity="0.15" stroke="url(#ring)" stroke-width="2.5"/>
  <circle cx="200" cy="190" r="70" fill="#1E3089" fill-opacity="0.4"/>
  <!-- Body -->
  <path d="M110 470 C110 360 150 300 200 300 C250 300 290 360 290 470" fill="#1E3089" fill-opacity="0.4" stroke="url(#ring)" stroke-width="2.5" stroke-opacity="0.5"/>
  <!-- Circuit decoration -->
  <circle cx="120" cy="120" r="3" fill="#608BFA"/>
  <circle cx="280" cy="120" r="3" fill="#A855F7"/>
  <path d="M130 120 H200 V190" stroke="#608BFA" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M270 120 H200 V190" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- TechTron mark -->
  <path d="M175 430 H225 M200 430 V460" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="485" text-anchor="middle" fill="#93B4FD" font-family="monospace" font-size="13" letter-spacing="4">TECHTRON</text>
</svg>